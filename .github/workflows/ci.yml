name: DiagramForge CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  # Quick checks that don't need full setup
  lint:
    name: Format and Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "27.3"
          install-hex: false
          install-rebar: false

      # hex.pm is a hard dependency of every setup-beam step: the action runs
      # `mix local.hex` on EVERY job, its default mirror list holds a single
      # entry (https://builds.hex.pm), and Mix gives up after 60 seconds. So one
      # bad minute on hex.pm fails a run before a line of code is compiled:
      #
      #   ** (Mix) request timed out after 60000ms
      #   Could not mix hex from any hex.pm mirror
      #
      # — which is exactly how a three-file docs change went red on 2026-09-02.
      #
      # The fix is to stop asking. setup-beam no longer installs either archive
      # (install-hex / install-rebar above) and this step installs them only
      # `--if-missing`, with retries. On the persistent self-hosted runners
      # MIX_HOME survives between jobs — infra's ci-runner-pool.sh gives each
      # pool slot a per-repo MIX_HOME — so the archives are already on disk and
      # this step makes no network call at all. On an ephemeral hosted runner it
      # still downloads once, but a transient failure now costs a retry instead
      # of the whole run.
      #
      # CAVEAT: --if-missing never upgrades. If an ELIXIR_VERSION bump ever needs
      # a newer Hex, the stale archive has to be cleared out of the slot's
      # MIX_HOME on the runner host; nothing here will do it for you.
      - name: Ensure hex and rebar
        run: |
          for tool in hex rebar; do
            installed=false
            for attempt in 1 2 3; do
              if mix local.$tool --if-missing --force; then
                installed=true
                break
              fi
              sleep $((attempt * 10))
            done
            if [ "$installed" != true ]; then
              echo "mix local.$tool failed after 3 attempts" >&2
              exit 1
            fi
          done

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: deps
          key: ${{ runner.os }}-mix-deps-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-deps-

      - name: Install dependencies
        run: mix deps.get

      - name: Check formatting
        run: mix format --check-formatted

      - name: Run credo static code analysis
        run: mix credo --strict

  # Main test job
  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: diagram_forge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost/diagram_forge_test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "27.3"
          install-hex: false
          install-rebar: false

      # Same reason as the first job: setup-beam's hex install is a per-job
      # hex.pm dependency, so install only what is missing, and retry.
      - name: Ensure hex and rebar
        run: |
          for tool in hex rebar; do
            installed=false
            for attempt in 1 2 3; do
              if mix local.$tool --if-missing --force; then
                installed=true
                break
              fi
              sleep $((attempt * 10))
            done
            if [ "$installed" != true ]; then
              echo "mix local.$tool failed after 3 attempts" >&2
              exit 1
            fi
          done

      - name: Cache build dependencies
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Cache Node.js dependencies
        uses: actions/cache@v4
        with:
          path: assets/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: ${{ runner.os }}-node-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile project
        run: mix compile --warnings-as-errors

      - name: Install Node.js dependencies
        run: |
          cd assets
          npm ci

      - name: Run tests
        run: mix test

  # Security scan
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "27.3"
          install-hex: false
          install-rebar: false

      # Same reason as the first job: setup-beam's hex install is a per-job
      # hex.pm dependency, so install only what is missing, and retry.
      - name: Ensure hex and rebar
        run: |
          for tool in hex rebar; do
            installed=false
            for attempt in 1 2 3; do
              if mix local.$tool --if-missing --force; then
                installed=true
                break
              fi
              sleep $((attempt * 10))
            done
            if [ "$installed" != true ]; then
              echo "mix local.$tool failed after 3 attempts" >&2
              exit 1
            fi
          done

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: deps
          key: ${{ runner.os }}-mix-deps-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-deps-

      - name: Install dependencies
        run: mix deps.get

      - name: Security scan
        run: mix sobelow --config

  # Type checking with Dialyzer
  dialyzer:
    name: Type Checking (Dialyzer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "27.3"
          install-hex: false
          install-rebar: false

      # Same reason as the first job: setup-beam's hex install is a per-job
      # hex.pm dependency, so install only what is missing, and retry.
      - name: Ensure hex and rebar
        run: |
          for tool in hex rebar; do
            installed=false
            for attempt in 1 2 3; do
              if mix local.$tool --if-missing --force; then
                installed=true
                break
              fi
              sleep $((attempt * 10))
            done
            if [ "$installed" != true ]; then
              echo "mix local.$tool failed after 3 attempts" >&2
              exit 1
            fi
          done

      - name: Cache build dependencies
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Cache Dialyxir PLT
        uses: actions/cache@v4
        with:
          path: |
            _build/dev/*.plt
            _build/dev/*.plt.hash
          key: ${{ runner.os }}-dialyxir-plt-dev-${{ hashFiles('mix.lock') }}-v1

      - name: Install dependencies
        run: mix deps.get

      - name: Compile project
        run: mix compile

      - name: Run dialyzer for type checking
        run: mix dialyzer --format short

  # Deploy to Fly.io (only on master branch)
  deploy:
    name: Deploy to Fly.io
    needs: [lint, test, security, dialyzer]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup Fly.io CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
